<!doctype html>
<html lang="ko">
<!-- 폰으로 받기 페이지: 부스 QR이 r.html?i=<사진 주소>&t=<제목> 으로 엶. 사진 + "사진 저장" 버튼 (사진은 1시간 뒤 자동 삭제) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>네컷</title>
<style>
body{margin:0;background:#ECEDEF;color:#141518;font-family:system-ui,sans-serif;text-align:center;padding:24px 16px 40px}
h1{font-size:22px;margin:0 0 16px}
img{max-width:100%;max-height:68vh;border-radius:4px;box-shadow:0 10px 30px rgba(20,21,24,.18)}
button{display:block;width:100%;max-width:360px;margin:22px auto 10px;padding:18px;border:0;border-radius:99px;background:#F28C28;color:#141518;font:700 20px system-ui,sans-serif}
p{margin:0;color:#4A4E57;font-size:14px;line-height:1.6}
</style>
<h1 id="h">네컷</h1>
<img id="p" alt="네컷 사진">
<button id="s">사진 저장</button>
<p id="m">안 되면 사진을 길게 눌러 저장하세요.<br>1시간 뒤 자동으로 지워져요.</p>
<script>
// n = 부스가 올린 파일 이름 (Supabase nekeot 버킷), i = 사진 전체 주소 (예전 방식)
const SB_PUBLIC = 'https://khmkdznemafpjoyqgrnl.supabase.co/storage/v1/object/public/nekeot/';
const q = new URLSearchParams(location.search), n = q.get('n') || '', name = 'nekeot.jpg';
const src = /^[\w.-]+$/.test(n) ? SB_PUBLIC + n + '.jpg' : (q.get('i') || '');
// 사진 주소는 https만 (다른 형식은 무시)
if (/^https:\/\//.test(src)) p.src = src; else { p.hidden = s.hidden = true; m.textContent = '사진 주소가 올바르지 않아요.'; }
h.textContent = document.title = (q.get('t') || '네컷').slice(0, 30);
p.onerror = () => { p.hidden = s.hidden = true; m.textContent = '사진이 없어요. 1시간이 지나 지워졌을 수 있어요.'; };
// 아이폰은 공유 창(→ 이미지 저장 = 사진 앱), 그 외는 파일 다운로드
s.onclick = async () => {
  s.disabled = true; s.textContent = '저장하는 중…';
  try {
    const b = await (await fetch(src)).blob(), f = new File([b], name, {type: 'image/jpeg'});
    if (/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files: [f]})) await navigator.share({files: [f]});
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click(); }
    s.textContent = '사진 저장';
  } catch (e) { s.textContent = e.name === 'AbortError' ? '사진 저장' : '다시 눌러 주세요'; }
  s.disabled = false;
};
</script>
</html>
